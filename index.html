<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>🎵 가요 듣고 노래 맞추기 퀴즈</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-screen">
    <!-- 심플 상단 헤더 -->
    <header class="top-bar">
      <h1 class="app-title">🎵 노래 맞추기 퀴즈</h1>
      <div class="top-actions">
        <div class="score-pill" id="scorePill">
          ⭕ 맞춘 개수 <strong id="scoreCount">0</strong>
        </div>
        <button type="button" id="shuffleDeckBtn" class="top-btn">
          🔀 순서 섞기
        </button>
      </div>
    </header>

    <!-- 가수 / 차트 선택 버튼 (한 줄 고정, 스와이프 없음) -->
    <nav class="category-bar" id="categoryChips" aria-label="가수 및 차트 선택">
      <button type="button" class="cat-btn active" data-category="ALL">🌈 전체</button>
      <button type="button" class="cat-btn" data-category="잔나비">🎸 잔나비</button>
      <button type="button" class="cat-btn" data-category="아이브">👑 아이브</button>
      <button type="button" class="cat-btn" data-category="아일릿">🧲 아일릿</button>
      <button type="button" class="cat-btn" data-category="에스파">⚡ 에스파</button>
      <button type="button" class="cat-btn" data-category="악뮤">🍀 악뮤</button>
      <button type="button" class="cat-btn" data-category="인기 아이돌">🌟 인기 아이돌</button>
      <button type="button" class="cat-btn" data-category="2026 차트">🔥 2026 차트</button>
    </nav>

    <!-- 메인 퀴즈 카드 -->
    <main class="quiz-card">
      <!-- 문제 번호 & 카테고리 -->
      <div class="card-top-row">
        <span class="question-counter" id="questionNumber">1 / 80</span>
        <span class="category-tag" id="questionCategoryTag">🎸 잔나비</span>
      </div>

      <!-- 중앙 앨범 사진 + 오디오 재생 버튼 -->
      <div class="media-row">
        <div class="photo-frame" id="albumArtFrame">
          <img
            id="albumCoverImg"
            class="album-photo"
            src=""
            alt="앨범 커버 사진"
            referrerpolicy="no-referrer"
            width="200"
            height="200"
          />
        </div>

        <div class="audio-controls">
          <button type="button" id="playToggleBtn" class="play-btn">
            <span class="btn-emoji" id="playBtnIcon">▶️</span>
            <span class="btn-text" id="playBtnLabel">노래 듣기</span>
          </button>

          <button type="button" id="stopAudioBtn" class="restart-btn">
            ⏹️ 처음부터 다시 듣기
          </button>

          <p class="status-text" id="audioStatusText">▶️ 버튼을 눌러 노래를 들어보세요!</p>
        </div>
      </div>

      <!-- 힌트 / 정답 표시 영역 -->
      <div class="info-stage" id="infoStage">
        <!-- 기본 안내 문구 -->
        <div class="stage-placeholder" id="stagePlaceholder">
          🎤 노래를 듣고 <strong>가수</strong>와 <strong>노래 제목</strong>을 외쳐보세요!
        </div>

        <!-- 힌트 박스 -->
        <div class="hint-box hidden" id="hintDisplayArea">
          <div class="hint-line" id="hintLyricRow">
            <span class="hint-tag">1단계 힌트</span>
            <span class="hint-text" id="hintLyricText"></span>
          </div>
          <div class="hint-line hidden" id="hintChoseongRow">
            <span class="hint-tag">2단계 초성</span>
            <span class="hint-text" id="hintChoseongText"></span>
          </div>
        </div>

        <!-- 정답 공개 박스 -->
        <div class="answer-box hidden" id="answerBanner">
          <div class="answer-text-wrap">
            <div class="answer-artist" id="answerArtistName">가수명</div>
            <div class="answer-title" id="answerSongTitle">노래 제목</div>
            <div class="answer-meta" id="answerMetaInfo"></div>
          </div>
          <button type="button" id="markCorrectBtn" class="correct-btn">
            ⭕ 맞췄어요! (+1점)
          </button>
        </div>
      </div>

      <!-- 하단 큼직한 조작 버튼 (힌트 / 정답 / 이전 / 다음) -->
      <div class="bottom-buttons">
        <button type="button" id="hintBtn" class="big-btn hint-btn">
          💡 힌트 보기
        </button>
        <button type="button" id="answerBtn" class="big-btn answer-btn">
          🎉 정답 보기
        </button>
        <button type="button" id="prevBtn" class="big-btn nav-btn">
          ⬅️ 이전 문제
        </button>
        <button type="button" id="nextBtn" class="big-btn nav-btn next-btn">
          다음 문제 ➡️
        </button>
      </div>
    </main>
  </div>

  <!-- 마지막 문제 완료 시 결과 모달 -->
  <dialog id="quizResultModal" class="modal-dialog" closedby="any" aria-labelledby="quizResultModalTitle">
    <div class="modal-box">
      <div class="result-emoji">🏆</div>
      <h2 id="quizResultModalTitle" class="result-title">모든 문제를 다 풀었어요!</h2>
      <p class="result-score">
        총 <strong id="finalTotalCount">80</strong>문제 중
        <strong id="finalCorrectCount" class="highlight-num">0</strong>문제 성공!
      </p>
      <div class="modal-buttons">
        <button type="button" id="restartSameDeckBtn" class="big-btn answer-btn">
          🔄 다시 섞어서 또 하기
        </button>
        <button type="button" id="closeResultModalBtn" class="big-btn nav-btn">
          닫기
        </button>
      </div>
    </div>
  </dialog>

  <script src="songs.js"></script>
  <script src="app.js"></script>
</body>
</html>
